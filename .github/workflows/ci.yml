name: Backend CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Initialize Database
      working-directory: ./backend
      run: |
        python -c "import sqlite3; conn = sqlite3.connect('weather.db'); conn.execute('CREATE TABLE IF NOT EXISTS weather_measurements (id INTEGER PRIMARY KEY AUTOINCREMENT, station_name VARCHAR NOT NULL, timestamp_utc DATETIME NOT NULL, temperature_c FLOAT, pressure_hpa FLOAT, wind_speed_ms FLOAT)'); conn.commit(); conn.close()"

    - name: Run Pytest
      working-directory: ./backend
      env:
        AEMET_API_KEY: "dummy_key_for_testing_purposes"
      run: |
        python -m pytest -v