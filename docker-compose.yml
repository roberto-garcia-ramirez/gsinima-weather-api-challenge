
services:
  backend:
    build: 
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - AEMET_API_KEY=${AEMET_API_KEY:-""}
    volumes:
      - ./backend/weather_data.db:/app/weather_data.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped